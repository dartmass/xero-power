<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #111827;
    }
    .header {
      background: #0a7a4b;
      color: #fff;
      padding: 14px 16px 12px;
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-ver   { font-size: 11px; opacity: .7; margin-top: 1px; }
    .badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      margin-top: 6px;
    }
    .badge-free { background: rgba(255,255,255,.2); color: #fff; }
    .badge-pro  { background: #fbbf24; color: #78350f; }

    .shortcuts {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .shortcuts-title {
      font-size: 10px; font-weight: 600; color: #9aa0b0;
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .shortcut-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 3px 0;
      font-size: 12px; color: #374151;
    }
    .key {
      background: #f4f5f7; border: 1px solid #dde0e8;
      border-radius: 4px; padding: 1px 6px;
      font-size: 11px; color: #555; font-family: monospace;
    }

    .footer {
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .settings-link {
      font-size: 12px; color: #0a7a4b; text-decoration: none;
      cursor: pointer;
    }
    .settings-link:hover { text-decoration: underline; }
    .version { font-size: 11px; color: #c8cdd8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Xero Power</div>
    <div class="header-ver">v0.4.0</div>
    <div class="badge badge-free" id="plan-badge">Free</div>
  </div>

  <div class="shortcuts">
    <div class="shortcuts-title">Active shortcuts</div>
    <div class="shortcut-row">
      <span>Command palette</span>
      <span class="key" id="key-palette">⌘K</span>
    </div>
    <div class="shortcut-row">
      <span>Bank Rec — Match</span>
      <span class="key" id="key-match">M</span>
    </div>
    <div class="shortcut-row">
      <span>Bank Rec — Create</span>
      <span class="key" id="key-create">C</span>
    </div>
    <div class="shortcut-row">
      <span>Bank Rec — Transfer</span>
      <span class="key" id="key-transfer">T</span>
    </div>
    <div class="shortcut-row">
      <span>Bank Rec — Discuss</span>
      <span class="key" id="key-discuss">D</span>
    </div>
  </div>

  <div class="footer">
    <a class="settings-link" id="settings-btn">⚙ Settings & Pro</a>
    <span class="version">v0.4.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
